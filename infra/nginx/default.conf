map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

resolver 127.0.0.11 valid=1s ipv6=off;
client_max_body_size 11m;
proxy_connect_timeout 2s;
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 3;
proxy_next_upstream_timeout 3s;

upstream backend_api {
    zone backend_api 64k;
    server backend:8000 resolve;
    keepalive 32;
    keepalive_timeout 15s;
}

upstream frontend_ui {
    zone frontend_ui 64k;
    server frontend:5173 resolve;
    keepalive 16;
}

server {
    listen 5173;
    server_name localhost;
    location = /api/v1/admin/operations/updates/packages {
        client_max_body_size 264m;
        proxy_request_buffering off;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_read_timeout 180s;
    }
    location = /sip {
        set $sip_backend http://telephony:8088;
        proxy_pass $sip_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
    location ~ ^/(api/|media/|healthz$) {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 180s;
    }
    location / {
        proxy_pass http://frontend_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

server {
    listen 8000;
    server_name localhost;
    location = /api/v1/admin/operations/updates/packages {
        client_max_body_size 264m;
        proxy_request_buffering off;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_read_timeout 180s;
    }
    location / {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
