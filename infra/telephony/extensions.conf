[general]
static=yes
writeprotect=yes

[training-only]
; Only an authenticated endpoint can enter this context. There are no trunks.
exten => 9000,1,Answer()
 same => n,Set(TIMEOUT(absolute)=180)
 same => n,Echo()
 same => n,Hangup()
; Every exercise token is authorized again against user, assignment and lesson.
exten => _[0-9a-f].,1,Stasis(dispatcher,${EXTEN})
 same => n,Hangup()
