[global]
type=global
user_agent=Dispatcher112-Training
endpoint_identifier_order=username

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[training-endpoint](!)
type=endpoint
transport=transport-ws
context=training-only
disallow=all
allow=ulaw
webrtc=yes
dtls_auto_generate_cert=yes
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
rtp_timeout=45
allow_transfer=no
allow_subscribe=no
trust_id_inbound=no
timers=no
rtp_keepalive=5

#include /data/telephony/accounts.conf
