map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}
resolver 127.0.0.11 valid=1s ipv6=off;
client_max_body_size 11m;
ssl_certificate /run/tls/tls.crt;
ssl_certificate_key /run/tls/tls.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:TLS:10m;
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /run/tls/ca.crt;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header X-Forwarded-Proto https;
proxy_read_timeout 180s;
proxy_connect_timeout 2s;
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 3;
proxy_next_upstream_timeout 3s;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;

upstream backend_api {
    zone backend_api 64k;
    server backend:8000 resolve;
    keepalive 32;
    keepalive_timeout 15s;
}
upstream frontend_ui {
    zone frontend_ui 64k;
    server frontend:5173 resolve;
    keepalive 16;
}
server {
    listen 5173 ssl;
    server_name localhost;
    location = /api/v1/admin/operations/updates/packages {
        client_max_body_size 264m;
        proxy_request_buffering off;
        proxy_ssl_name backend;
        proxy_pass https://backend_api;
    }
    location = /sip {
        set $sip_backend https://telephony:8089;
        proxy_ssl_name telephony;
        proxy_pass $sip_backend/ws;
    }
    location ~ ^/(api/|media/|healthz$) {
        proxy_ssl_name backend;
        proxy_pass https://backend_api;
    }
    location / {
        proxy_ssl_name frontend;
        proxy_pass https://frontend_ui;
    }
}
server {
    listen 8000 ssl;
    server_name localhost;
    location = /api/v1/admin/operations/updates/packages {
        client_max_body_size 264m;
        proxy_request_buffering off;
        proxy_ssl_name backend;
        proxy_pass https://backend_api;
    }
    location / {
        proxy_ssl_name backend;
        proxy_pass https://backend_api;
    }
}
