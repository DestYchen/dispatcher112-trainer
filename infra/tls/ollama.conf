server {
    listen 11435 ssl;
    server_name ollama;
    ssl_certificate /run/tls/tls.crt;
    ssl_certificate_key /run/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 11m;
    location / {
        proxy_pass http://127.0.0.1:11434;
        proxy_read_timeout 180s;
    }
}
